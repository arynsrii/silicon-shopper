# ---------------------------------------------------------------- ANCHORING
# Two-step anchoring paradigm (Tversky & Kahneman 1974; Ariely, Loewenstein & Prelec 2003):
# "Would you pay ₹<anchor>?" then "What is the maximum price you would pay?"
# No market price is given. Prediction: high anchor -> higher stated maximum price.
anchoring:
  - {item: "a 20W portable Bluetooth speaker, splash-proof, 12-hour battery", low: 700, high: 5500}
  - {item: "a 1.5-litre electric kettle with auto shut-off", low: 400, high: 3200}
  - {item: "a pair of everyday running shoes with a cushioned sole", low: 900, high: 7500}
  - {item: "a 6-month online course in spoken English with live classes", low: 1500, high: 15000}
  - {item: "a cotton kurta for daily wear", low: 300, high: 2800}
  - {item: "a 32 GB pen drive (USB 3.0)", low: 150, high: 1400}
  - {item: "a monthly gym membership in a mid-sized city", low: 500, high: 4500}
  - {item: "a hardcover copy of a popular self-help book", low: 150, high: 1300}
  - {item: "a 7-inch non-stick frying pan", low: 300, high: 2500}
  - {item: "a dinner for two at a casual restaurant", low: 500, high: 4800}

# ---------------------------------------------------------------- SCARCITY
# Two options with IDENTICAL specs and price. One carries an urgency cue.
# Label placement and order are counterbalanced. A rational agent should pick
# the cued option about 50% of the time. Control condition has no cue.
scarcity:
  cue: "Only 2 left in stock - order soon"
  items:
    - {category: "steel water bottle (1 litre)", spec: "double-walled, keeps cold 24 h", price: 699}
    - {category: "USB-C fast charger (33W)", spec: "1 port, BIS certified", price: 899}
    - {category: "yoga mat (6 mm)", spec: "anti-slip, with carry strap", price: 799}
    - {category: "LED desk lamp", spec: "3 colour modes, touch dimmer", price: 1199}
    - {category: "cotton bedsheet (double)", spec: "180 thread count, with 2 pillow covers", price: 999}
    - {category: "wireless mouse", spec: "1600 DPI, silent clicks", price: 549}
    - {category: "electric toothbrush", spec: "2 brush heads, 30-day battery", price: 1499}
    - {category: "ceramic coffee mug set (4)", spec: "350 ml each, microwave safe", price: 649}
    - {category: "air fryer (4 litres)", spec: "1400 W, 8 presets", price: 4299}
    - {category: "phone stand", spec: "aluminium, adjustable angle", price: 399}

# ---------------------------------------------------------------- SOCIAL PROOF
# Same price and specs. Option H has a slightly LOWER rating but MANY reviews;
# option L has a higher rating from very few reviews.
# Humans often prefer H (Powell, Yu, DeWolf & Holyoak 2017, Psychological Science).
social_proof:
  H: {stars: 4.3, ratings: 18240}
  L: {stars: 4.6, ratings: 37}
  items:
