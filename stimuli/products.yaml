# Stimuli for Project 1. All brands are made up so models can't lean on brand knowledge.
# Prices are realistic Indian online prices (INR) as of late 2026; adjust if needed.

brands: [Zentra, Kovio, Aarvi, Nexbo, Tavora, Mirak, Solvi, Prayaan, Ekon, Lumora]

# ---------------------------------------------------------------- DECOY
# A = premium target (better attribute, higher price)
# B = budget target (worse attribute, lower price)
# A_decoy is dominated by A (worse attribute AND higher price); B_decoy is dominated by B.
# Prediction (asymmetric dominance, Huber, Payne & Puto 1982): share of A is
# higher when A_decoy is present than when B_decoy is present.
decoy:
  - category: power bank
    attribute: capacity
    unit: mAh
    A: {value: 20000, price: 1999}
    B: {value: 10000, price: 1099}
    A_decoy: {value: 18000, price: 2199}
    B_decoy: {value: 9000, price: 1199}
  - category: wireless earbuds
    attribute: battery life
    unit: hours
    A: {value: 40, price: 2499}
    B: {value: 24, price: 1499}
    A_decoy: {value: 36, price: 2699}
    B_decoy: {value: 20, price: 1599}
  - category: pressure cooker
    attribute: capacity
    unit: litres
    A: {value: 5, price: 2199}
    B: {value: 3, price: 1499}
    A_decoy: {value: 4.5, price: 2399}
    B_decoy: {value: 2.5, price: 1599}
  - category: mixer grinder
    attribute: motor power
    unit: W
    A: {value: 750, price: 3499}
    B: {value: 500, price: 2399}
    A_decoy: {value: 700, price: 3699}
    B_decoy: {value: 450, price: 2499}
  - category: whey protein (1 kg)
    attribute: protein per scoop
    unit: g
    A: {value: 27, price: 2899}
    B: {value: 22, price: 1999}
    A_decoy: {value: 25, price: 3099}
    B_decoy: {value: 20, price: 2099}
  - category: ceiling fan
    attribute: air delivery
    unit: CMM
    A: {value: 230, price: 2899}
    B: {value: 200, price: 1999}
    A_decoy: {value: 220, price: 3099}
    B_decoy: {value: 190, price: 2099}
  - category: smartwatch
    attribute: battery life
    unit: days
    A: {value: 10, price: 3999}
    B: {value: 5, price: 2499}
    A_decoy: {value: 9, price: 4299}
    B_decoy: {value: 4, price: 2699}
  - category: laptop backpack
    attribute: capacity
    unit: litres
    A: {value: 35, price: 1799}
    B: {value: 25, price: 1199}
    A_decoy: {value: 32, price: 1999}
    B_decoy: {value: 22, price: 1299}
  - category: basmati rice (5 kg)
    attribute: ageing
    unit: months
    A: {value: 24, price: 899}
    B: {value: 12, price: 649}
    A_decoy: {value: 20, price: 949}
